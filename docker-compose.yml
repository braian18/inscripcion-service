version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    container_name: inscripciones_backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASS=12345
      - DB_NAME=inscripcion
      - PORT=3000
      - CORE_API=http://core-api:3001
      - NOTIFICACIONES_API=http://notificaciones-api:3002
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  
    container_name: inscripciones_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VUE_APP_API_URL=http://localhost:3000  
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: inscripciones_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=inscripcion
      - MYSQL_USER=user
      - MYSQL_PASSWORD=12345
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge