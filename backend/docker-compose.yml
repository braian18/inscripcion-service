version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    container_name: inscripciones_app
    environment:
      - DB_HOST=mysql  # ⚠️ CAMBIAR de 'localhost' a 'mysql'
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASS=12345
      - DB_NAME=inscripcion
      - PORT=3000
      - CORE_API=http://core-api:3001  # ⚠️ CAMBIAR si también es un servicio Docker
      - NOTIFICACIONES_API=http://notificaciones-api:3002  # ⚠️ CAMBIAR si también es un servicio Docker
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: inscripciones_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=inscripcion
      - MYSQL_USER=user
      - MYSQL_PASSWORD=12345
    ports:
      - "3306:3306"  
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: